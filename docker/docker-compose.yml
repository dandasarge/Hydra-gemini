version: '3.8'

# Standalone Hydra stack — own Redis, no forgemmo dependency.
services:
  redis:
    image: redis:7-alpine
    container_name: hydra-redis
    restart: unless-stopped
    volumes:
      - hydra_redis_data:/data

  hydra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hydra-gemini
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ../keys.json:/app/keys.json:ro
    command: ["hydra", "gateway", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  hydra_redis_data:
